name: eva3-gasfiteria
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-eva3_back_end}
      MYSQL_USER: ${DB_USER:-eva3_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-tests.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
